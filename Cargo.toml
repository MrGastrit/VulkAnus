[package]
name = "VulkanUS"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small Vulkan 1.3 renderer built with ash, GLFW and VMA"

[[bin]]
name = "vulkanus"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ash = "0.38.0"
bytemuck = { version = "1.24", features = ["derive"] }
env_logger = "0.11"
glfw = { version = "0.63", default-features = false, features = ["vulkan", "x11", "src-build", "raw-window-handle-v0-6"] }
log = "0.4"
vk-mem = "0.5"

[build-dependencies]
naga = { version = "27.0.3", features = ["glsl-in", "spv-out"] }

[profile.release]
lto = "thin"
codegen-units = 1

